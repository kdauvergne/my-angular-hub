<div class="max-w-3xl mx-auto my-10 p-4 space-y-6">
  <h1 class="text-3xl font-extrabold text-primary">Générateur simplifié de nombres aléatoires</h1>

  <div class="flex flex-wrap gap-2">
    <button type="button" class="btn btn-success" (click)="start()">Démarrer</button>
    <button type="button" class="btn btn-warning" (click)="pauseResume()">
      {{ paused() ? 'Reprendre' : 'Pause' }}
    </button>
    <button type="button" class="btn btn-error" (click)="stop()">Arrêter</button>
  </div>

  <div class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body">
      <h2 class="card-title">Nombres générés</h2>
      @for (number of numbers(); track $index) {
        <div class="flex flex-wrap gap-2 text-2xl">{{ number }}</div>
      } @empty {
        <div class="flex flex-wrap gap-2"><p>Aucun nombre généré pour l'instant</p></div>
      }
    </div>
  </div>
</div>
