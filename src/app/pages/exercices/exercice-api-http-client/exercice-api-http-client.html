<div class="max-w-6xl mx-auto my-10 p-4 space-y-6">
  <h1 class="text-3xl font-extrabold text-primary">Digimons</h1>

  @if (isLoading()) {
    <div class="flex justify-center">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  }

  @if (errorMessage()) {
    <div role="alert" class="alert alert-error">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
    @for (digimon of digimons(); track digimon.id) {
      <div class="card bg-base-100 border border-base-300 shadow-sm">
        <figure class="bg-base-200 p-4">
          <img
            class="w-full aspect-square object-contain"
            [src]="digimon.image"
            [alt]="digimon.name"
          />
        </figure>
        <div class="card-body p-4">
          <span class="badge badge-ghost badge-sm">#{{ digimon.id }}</span>
          <h2 class="card-title text-base">{{ digimon.name }}</h2>
        </div>
      </div>
    }
  </div>

  <div class="flex items-center justify-center gap-4">
    <button
      type="button"
      class="btn btn-outline"
      [disabled]="currentPage() === 0 || isLoading()"
      (click)="previousPage()"
    >
      Précédent
    </button>
    <span class="text-sm">Page {{ currentPage() + 1 }} / {{ totalPages() }}</span>
    <button
      type="button"
      class="btn btn-outline"
      [disabled]="currentPage() >= totalPages() - 1 || isLoading()"
      (click)="nextPage()"
    >
      Suivant
    </button>
  </div>
</div>
