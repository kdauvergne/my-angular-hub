<div class="card bg-base-100 border border-base-300 shadow-md">
  <div class="card-body space-y-4">
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-center gap-3">
        <span class="text-5xl">{{ emoji() }}</span>
        <div class="space-y-1">
          <h2 class="card-title">{{ name() }}</h2>
          <span class="badge badge-primary badge-outline">{{ species() }}</span>
        </div>
      </div>

      @if (isAdopted()) {
        <span class="badge badge-success">Adopté</span>
      } @else {
        <span class="badge badge-warning">À adopter</span>
      }
    </div>

    <div class="space-y-2 text-sm">
      <p>Âge : {{ accordAge() }}</p>
      <div class="flex justify-between">
        <span>Énergie</span>
        <span>{{ energyLevel() }} %</span>
      </div>
      <progress
        class="progress progress-primary w-full"
        [value]="energyLevel()"
        max="100"
      ></progress>
    </div>

    <button type="button" class="btn btn-primary btn-block" (click)="statusChange.emit()">
      {{ isAdopted() ? 'Déjà adopté' : 'Adopter' }}
    </button>
    <button type="button" class="btn btn-sm" (click)="energyChange.emit(10)">Jouer</button>
    <button type="button" class="btn btn-sm" (click)="energyChange.emit(-10)">Sieste</button>
  </div>
</div>
